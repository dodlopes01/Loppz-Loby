<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Loppz Loby</title>
<style>
  :root {
    --felt: #141212; --felt-2: #1C1918; --panel: #211D1C; --panel-2: #29231F;
    --gold: #C9A227; --gold-dim: #8F7620; --red: #A62D24; --red-dim: #7A211A; --red-bg: rgba(166,45,36,0.15);
    --cream: #EFE7D2; --muted: #9C9490;
    --call: #4FAE64; --raise: #E8443E; --allin: #7A2323; --fold-cell: #3D6FB4;
    --line: rgba(239, 231, 210, 0.14); --card-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: radial-gradient(ellipse at top, #1C1918 0%, #0A0908 100%);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .shell { display: flex; flex-direction: column; min-height: 100vh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--felt-2) 0%, var(--felt) 100%);
    flex-shrink: 0; position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(160deg, var(--gold) 0%, var(--gold-dim) 100%);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #1A1508;
    flex-shrink: 0; box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  .brand-text h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.01em; color: var(--gold); line-height: 1.15; }
  .brand-text p { margin: 1px 0 0; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .nav-pills { display: flex; gap: 6px; }
  .nav-pill {
    background: var(--panel); border: 1px solid var(--line); color: var(--cream);
    font-size: 12.5px; font-weight: 700; padding: 9px 16px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s;
  }
  .nav-pill:hover { border-color: var(--gold-dim); }
  .nav-pill.active { background: var(--red); border-color: var(--red); color: var(--cream); }

  .content { flex: 1; position: relative; }
  .content iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: var(--felt);
  }

  /* ---------------- HOME ---------------- */
  .home-panel { position: absolute; inset: 0; overflow-y: auto; display: none; }
  .home-panel.show { display: block; }
  .home-inner { max-width: 720px; margin: 0 auto; padding: 48px 20px 70px; }

  .home-hero { text-align: center; margin-bottom: 40px; }
  .home-hero .hero-mark {
    width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px;
    background: linear-gradient(160deg, var(--gold) 0%, var(--gold-dim) 100%);
    display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #1A1508;
    box-shadow: 0 8px 24px rgba(201,162,39,0.25);
  }
  .home-hero h2 { margin: 0 0 10px; font-size: 26px; font-weight: 800; color: var(--gold); letter-spacing: 0.01em; }
  .home-hero p { margin: 0 auto; font-size: 13.5px; color: var(--muted); line-height: 1.6; max-width: 420px; }

  .tool-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .tool-card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 26px 24px; cursor: pointer; box-shadow: var(--card-shadow);
    transition: border-color .15s, transform .15s;
    display: flex; align-items: center; gap: 18px;
  }
  .tool-card:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
  .tool-card .tic {
    flex-shrink: 0; width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .tool-card.c-ranges .tic { background: rgba(232,68,62,0.15); }
  .tool-card.c-glossario .tic { background: rgba(79,174,100,0.15); }
  .tool-card .tbody { flex: 1; min-width: 0; }
  .tool-card .tlbl { display: block; font-size: 16px; font-weight: 800; color: var(--cream); line-height: 1.3; margin-bottom: 4px; }
  .tool-card .tdesc { font-size: 12.5px; color: var(--muted); line-height: 1.5; display: block; }
  .tool-card .tarrow { flex-shrink: 0; font-size: 20px; color: var(--gold-dim); }

  .home-footer { text-align: center; margin-top: 40px; font-size: 11px; color: var(--muted); line-height: 1.7; }

  @media (min-width: 760px) {
    .topbar { padding: 18px 26px; }
    .brand-mark { width: 40px; height: 40px; font-size: 20px; border-radius: 11px; }
    .brand-text h1 { font-size: 20px; }
    .brand-text p { font-size: 11px; }
    .nav-pill { font-size: 13.5px; padding: 10px 20px; }

    .home-inner { padding: 80px 24px 90px; }
    .home-hero { margin-bottom: 52px; }
    .home-hero h2 { font-size: 32px; }
    .home-hero p { font-size: 14.5px; }

    .tool-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
    .tool-card { flex-direction: column; align-items: flex-start; text-align: left; padding: 32px 28px; gap: 16px; }
    .tool-card .tic { width: 64px; height: 64px; font-size: 30px; }
    .tool-card .tlbl { font-size: 18px; }
    .tool-card .tdesc { font-size: 13px; }
    .tool-card .tarrow { display: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand" id="brandHome">
      <div class="brand-mark">♠</div>
      <div class="brand-text">
        <h1>Loppz Loby</h1>
        <p>estudo de poker · offline</p>
      </div>
    </div>
    <div class="nav-pills" id="navPills"></div>
  </div>

  <div class="content">
    <iframe id="frame" title="conteúdo" style="display:none;"></iframe>

    <div class="home-panel show" id="homePanel">
      <div class="home-inner">
        <div class="home-hero">
          <div class="hero-mark">♠</div>
          <h2>Loppz Loby</h2>
          <p>Ferramentas de estudo pré-flop com ranges reais de solver — offline, direto no navegador.</p>
        </div>

        <div class="tool-grid" id="toolGrid"></div>

        <div class="home-footer">Seus dados ficam salvos só neste navegador. Nada é enviado pra nenhum servidor.</div>
      </div>
    </div>
  </div>

</div>

<script>
  var TABS = [
    { id: 'ranges',    label: 'Ranges Pré-Flop', file: 'ranges.html',    icon: '🗺️', cls: 'c-ranges',
      desc: 'RFI e Defesa do BB com ranges reais de solver, editáveis mesa por mesa.' },
    { id: 'glossario', label: 'Glossário',       file: 'glossario.html', icon: '📖', cls: 'c-glossario',
      desc: 'Termos e conceitos de poker, com seus próprios verbetes editáveis.' }
  ];

  var tabsEl = document.getElementById('navPills');
  var frame = document.getElementById('frame');
  var homePanel = document.getElementById('homePanel');
  var toolGrid = document.getElementById('toolGrid');

  var homePill = document.createElement('button');
  homePill.className = 'nav-pill active';
  homePill.innerHTML = '<span>🏠</span> Início';
  homePill.dataset.id = '__home__';
  homePill.addEventListener('click', function() { selectTab('__home__'); });
  tabsEl.appendChild(homePill);

  TABS.forEach(function(tab) {
    var btn = document.createElement('button');
    btn.className = 'nav-pill';
    btn.innerHTML = '<span>' + tab.icon + '</span> ' + tab.label;
    btn.dataset.id = tab.id;
    btn.addEventListener('click', function() { selectTab(tab.id); });
    tabsEl.appendChild(btn);

    var card = document.createElement('div');
    card.className = 'tool-card ' + tab.cls;
    card.innerHTML =
      '<div class="tic">' + tab.icon + '</div>' +
      '<div class="tbody">' +
        '<span class="tlbl">' + tab.label + '</span>' +
        '<span class="tdesc">' + tab.desc + '</span>' +
      '</div>' +
      '<div class="tarrow">›</div>';
    card.addEventListener('click', function() { selectTab(tab.id); });
    toolGrid.appendChild(card);
  });

  document.getElementById('brandHome').addEventListener('click', function() { selectTab('__home__'); });

  function selectTab(id) {
    Array.prototype.forEach.call(tabsEl.children, function(btn) {
      btn.classList.toggle('active', btn.dataset.id === id);
    });

    if (id === '__home__') {
      frame.style.display = 'none';
      homePanel.classList.add('show');
      return;
    }

    homePanel.classList.remove('show');
    frame.style.display = 'block';
    var tab = TABS.filter(function(t) { return t.id === id; })[0];
    if (tab) frame.src = tab.file;
  }
</script>
</body>
</html>
