<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Glossário</title>
<style>
  :root {
    --felt: #141212; --felt-2: #1C1918; --panel: #211D1C; --panel-2: #29231F;
    --gold: #C9A227; --gold-dim: #8F7620; --red: #A62D24; --red-dim: #7A211A; --red-bg: rgba(166,45,36,0.15);
    --cream: #EFE7D2; --muted: #9C9490;
    --call: #4FAE64; --call-bg: #123420; --raise: #E8443E; --raise-bg: #3A1616;
    --line: rgba(239, 231, 210, 0.14); --card-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: radial-gradient(ellipse at top, #1C1918 0%, #0A0908 100%);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 19px; font-weight: 800; letter-spacing: 0.02em; margin: 0; color: var(--gold); }
  header span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .range-card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px;
    margin-bottom: 16px; box-shadow: var(--card-shadow);
  }

  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  input#search {
    flex: 1; background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px;
    color: var(--cream); font-size: 15px; padding: 12px 14px; outline: none;
  }
  input#search:focus { border-color: var(--gold-dim); }
  .add-btn {
    flex-shrink: 0; background: var(--red); border: 1px solid var(--red); color: var(--cream);
    font-size: 14px; font-weight: 800; padding: 0 18px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .add-btn:hover { background: var(--red-dim); }

  .az { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .az button {
    width: 27px; height: 27px; font-size: 11px; font-weight: 700; border-radius: 7px;
    background: var(--felt-2); border: 1px solid var(--line); color: var(--muted); cursor: pointer;
  }
  .az button.has { color: var(--cream); border-color: var(--line); }
  .az button.has:hover { border-color: var(--gold-dim); color: var(--gold); }
  .az button:disabled { opacity: 0.35; cursor: default; }

  .count { font-size: 11.5px; color: var(--muted); margin: 14px 2px 10px; }

  /* ---- formulário de novo/edição de termo ---- */
  .term-form {
    background: var(--felt-2); border: 1.5px dashed var(--gold-dim); border-radius: 14px;
    padding: 14px; margin-bottom: 16px;
  }
  .term-form input, .term-form textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    color: var(--cream); font-size: 14.5px; padding: 10px 12px; outline: none; font-family: inherit;
    margin-bottom: 8px;
  }
  .term-form input:focus, .term-form textarea:focus { border-color: var(--gold-dim); }
  .term-form textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
  .term-form-actions { display: flex; gap: 8px; }
  .term-form-actions button {
    flex: 1; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 800; cursor: pointer; border: none;
  }
  .term-form-actions .save { background: var(--red); color: var(--cream); }
  .term-form-actions .cancel { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .form-status { font-size: 11.5px; color: var(--danger, #D2564A); margin: -2px 0 8px; min-height: 14px; }

  h2.cat {
    font-size: 12px; color: var(--gold); letter-spacing: 0.1em; font-weight: 800;
    margin: 22px 2px 8px; text-transform: uppercase;
  }
  .term {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 8px; scroll-margin-top: 12px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .term-body { flex: 1; min-width: 0; }
  .term b { color: var(--cream); font-size: 14.5px; display: block; margin-bottom: 3px; }
  .term p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; white-space: pre-wrap; }
  .term-actions { flex-shrink: 0; display: flex; gap: 4px; }
  .term-actions button {
    width: 28px; height: 28px; border-radius: 8px; background: var(--felt-2); border: 1px solid var(--line);
    color: var(--muted); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .term-actions button:hover { border-color: var(--gold-dim); color: var(--gold); }
  .term-actions .del-btn:hover { border-color: var(--red-dim); color: var(--red); }

  .empty {
    text-align: center; color: var(--muted); font-size: 13.5px; margin: 50px 10px; line-height: 1.7;
  }
  .empty .big { font-size: 34px; display: block; margin-bottom: 12px; }

  .io-toggle {
    background: transparent; border: none; color: var(--muted); font-size: 11.5px;
    text-decoration: underline; cursor: pointer; padding: 0; margin-top: 6px;
  }
  .io-panel { display: none; margin-top: 12px; }
  .io-panel.show { display: block; }
  .io-panel textarea {
    width: 100%; min-height: 90px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--cream); font-size: 12px; padding: 10px; font-family: ui-monospace, monospace; resize: vertical;
  }
  .io-row { display: flex; gap: 8px; margin-top: 8px; }
  .io-row button {
    background: var(--felt-2); border: 1px solid var(--line); color: var(--cream);
    font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  .io-row button:hover { border-color: var(--gold-dim); }
  .io-status { font-size: 11.5px; color: var(--gold); min-height: 14px; margin-top: 6px; }

  footer { margin-top: 20px; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.6; }

  @media (min-width: 760px) {
    .wrap { max-width: 720px; padding: 40px 24px 70px; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📖 Glossário</h1>
    <span id="termCountBadge">0 termos</span>
  </header>

  <div class="range-card">
    <div class="search-row">
      <input type="text" id="search" placeholder="Buscar termo ou definição..." autocomplete="off">
      <button class="add-btn" id="addBtn">+ Termo</button>
    </div>
    <div class="az" id="azNav"></div>
  </div>

  <div id="formSlot"></div>

  <div class="count" id="countLine"></div>
  <div id="list"></div>

  <div style="text-align:center;">
    <button class="io-toggle" id="ioToggle">🔄 Backup (copiar / colar entre navegadores)</button>
  </div>
  <div class="io-panel range-card" id="ioPanel">
    <h3 style="margin:0 0 8px; font-size:13px; color:var(--gold);">1. Copiar meus termos daqui</h3>
    <textarea id="exportArea" readonly placeholder="Clique em Copiar abaixo..."></textarea>
    <div class="io-row"><button id="copyBtn">📋 Copiar</button></div>
    <h3 style="margin:16px 0 8px; font-size:13px; color:var(--gold);">2. Colar no outro navegador/aparelho</h3>
    <textarea id="importArea" placeholder="Cole aqui o texto que você copiou antes"></textarea>
    <div class="io-row"><button id="importBtn">Aplicar</button></div>
    <p class="io-status" id="ioStatus"></p>
  </div>

  <footer>💾 Seus termos salvam automaticamente neste navegador.</footer>
</div>

<script>
(function() {
  var STORAGE_KEY = 'loppzloby_glossario_v1';
  var terms = []; // [{id, term, def}]
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) terms = JSON.parse(saved);
  } catch (e) { /* localStorage indisponível */ }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(terms)); } catch (e) { /* ignora */ }
  }

  function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function normalize(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  var searchInput = document.getElementById('search');
  var azNav = document.getElementById('azNav');
  var listEl = document.getElementById('list');
  var countLine = document.getElementById('countLine');
  var formSlot = document.getElementById('formSlot');
  var termCountBadge = document.getElementById('termCountBadge');

  var query = '';
  var editingId = null; // termo sendo editado (formulário troca de lugar)
  var addingNew = false;

  function letterOf(t) {
    var c = normalize(t.term).charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : '#';
  }

  function renderAzNav() {
    var present = {};
    terms.forEach(function(t) { present[letterOf(t)] = true; });
    var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    azNav.innerHTML = '';
    alphabet.forEach(function(L) {
      var btn = document.createElement('button');
      btn.textContent = L;
      var has = !!present[L];
      btn.className = has ? 'has' : '';
      btn.disabled = !has;
      btn.addEventListener('click', function() {
        var target = document.getElementById('cat-' + L);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      azNav.appendChild(btn);
    });
  }

  function buildForm(existing) {
    var form = document.createElement('div');
    form.className = 'term-form';

    var nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'Termo (ex: 3-bet, ICM, Range polarizado...)';
    nameInput.value = existing ? existing.term : '';

    var defInput = document.createElement('textarea');
    defInput.placeholder = 'Explicação em português claro...';
    defInput.value = existing ? existing.def : '';

    var status = document.createElement('div');
    status.className = 'form-status';

    var actions = document.createElement('div');
    actions.className = 'term-form-actions';

    var saveBtn = document.createElement('button');
    saveBtn.className = 'save';
    saveBtn.textContent = existing ? '💾 Salvar alterações' : '💾 Adicionar termo';

    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel';
    cancelBtn.textContent = 'Cancelar';

    function doSave() {
      var name = nameInput.value.trim();
      var def = defInput.value.trim();
      if (!name) { status.textContent = 'Digite o termo.'; nameInput.focus(); return; }
      if (!def) { status.textContent = 'Digite a explicação.'; defInput.focus(); return; }
      if (existing) {
        existing.term = name;
        existing.def = def;
      } else {
        terms.push({ id: uid(), term: name, def: def });
      }
      persist();
      editingId = null;
      addingNew = false;
      render();
    }

    saveBtn.addEventListener('click', doSave);
    cancelBtn.addEventListener('click', function() {
      editingId = null;
      addingNew = false;
      render();
    });
    defInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) doSave();
    });

    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    form.appendChild(nameInput);
    form.appendChild(defInput);
    form.appendChild(status);
    form.appendChild(actions);
    return { form: form, nameInput: nameInput };
  }

  document.getElementById('addBtn').addEventListener('click', function() {
    editingId = null;
    addingNew = true;
    render();
  });

  function renderFormSlot() {
    formSlot.innerHTML = '';
    if (addingNew) {
      var built = buildForm(null);
      formSlot.appendChild(built.form);
      built.nameInput.focus();
    }
  }

  function matchesQuery(t) {
    if (!query) return true;
    var q = normalize(query);
    return normalize(t.term).indexOf(q) !== -1 || normalize(t.def).indexOf(q) !== -1;
  }

  function render() {
    renderAzNav();
    renderFormSlot();

    termCountBadge.textContent = terms.length + (terms.length === 1 ? ' termo' : ' termos');

    var filtered = terms.filter(matchesQuery).sort(function(a, b) {
      return normalize(a.term).localeCompare(normalize(b.term));
    });

    listEl.innerHTML = '';

    if (!terms.length) {
      countLine.textContent = '';
      listEl.innerHTML = '<div class="empty"><span class="big">📖</span>Seu glossário está vazio.<br>Toque em <b style="color:var(--cream)">+ Termo</b> acima pra adicionar o primeiro.</div>';
      return;
    }
    if (!filtered.length) {
      countLine.textContent = '';
      listEl.innerHTML = '<div class="empty">Nenhum termo encontrado pra "' + query + '".</div>';
      return;
    }

    countLine.textContent = filtered.length + ' de ' + terms.length + (terms.length === 1 ? ' termo' : ' termos');

    var lastLetter = null;
    filtered.forEach(function(t) {
      var L = letterOf(t);
      if (L !== lastLetter) {
        var h = document.createElement('h2');
        h.className = 'cat';
        h.id = 'cat-' + L;
        h.textContent = L;
        listEl.appendChild(h);
        lastLetter = L;
      }

      if (editingId === t.id) {
        var built = buildForm(t);
        listEl.appendChild(built.form);
        built.nameInput.focus();
        return;
      }

      var row = document.createElement('div');
      row.className = 'term';

      var body = document.createElement('div');
      body.className = 'term-body';
      var bEl = document.createElement('b');
      bEl.textContent = t.term;
      var pEl = document.createElement('p');
      pEl.textContent = t.def;
      body.appendChild(bEl);
      body.appendChild(pEl);

      var actions = document.createElement('div');
      actions.className = 'term-actions';

      var editBtn = document.createElement('button');
      editBtn.textContent = '✎';
      editBtn.title = 'Editar';
      editBtn.addEventListener('click', function() {
        addingNew = false;
        editingId = t.id;
        render();
      });

      var delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '✕';
      delBtn.title = 'Excluir';
      delBtn.addEventListener('click', function() {
        if (!confirm('Excluir o termo "' + t.term + '"?')) return;
        terms = terms.filter(function(x) { return x.id !== t.id; });
        persist();
        render();
      });

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(body);
      row.appendChild(actions);
      listEl.appendChild(row);
    });
  }

  searchInput.addEventListener('input', function() {
    query = searchInput.value;
    render();
  });

  // ---------- backup manual (texto) ----------
  var ioToggle = document.getElementById('ioToggle');
  var ioPanel = document.getElementById('ioPanel');
  ioToggle.addEventListener('click', function() {
    ioPanel.classList.toggle('show');
    if (ioPanel.classList.contains('show')) {
      document.getElementById('exportArea').value = JSON.stringify(terms);
    }
  });

  document.getElementById('copyBtn').addEventListener('click', function() {
    var area = document.getElementById('exportArea');
    area.value = JSON.stringify(terms);
    area.select();
    try {
      document.execCommand('copy');
      document.getElementById('ioStatus').textContent = 'Copiado! Cole em outro navegador/aparelho.';
    } catch (e) {
      document.getElementById('ioStatus').textContent = 'Não deu pra copiar automaticamente — selecione e copie manualmente.';
    }
  });

  document.getElementById('importBtn').addEventListener('click', function() {
    var raw = document.getElementById('importArea').value.trim();
    var statusEl = document.getElementById('ioStatus');
    if (!raw) { statusEl.textContent = 'Cole o texto de backup primeiro.'; return; }
    try {
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('formato inválido');
      if (!confirm('Isso substitui todos os ' + terms.length + ' termos atuais por ' + parsed.length + ' termos do backup. Continuar?')) return;
      terms = parsed;
      persist();
      render();
      statusEl.textContent = 'Importado! ' + terms.length + ' termos carregados.';
    } catch (e) {
      statusEl.textContent = 'Texto inválido — confira se colou o backup completo.';
    }
  });

  render();
})();
</script>
</body>
</html>
